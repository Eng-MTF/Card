<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>م. ميشيل طلعت فكري — كارت شخصي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#d4af37;--gold2:#f3d98b;--bg:#0b0b10;--txt:#f5f1e6;--mut:#a9a493}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#2a2210 0,transparent 45%),radial-gradient(circle at 90% 100%,#1b1630 0,transparent 50%),var(--bg);color:var(--txt);font-family:'Cairo',Tahoma,Arial,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:430px;padding:20px 18px 32px;position:relative}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.avatar{width:148px;height:137px;border-radius:22px;margin:0 auto;overflow:hidden;background:#dfe6f2;box-shadow:0 0 0 3px rgba(212,175,55,.55),0 8px 28px rgba(0,0,0,.45)}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.gold{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:16px;font-weight:700;font-size:16px;border:0;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;font-size:18px;padding:16px;box-shadow:0 6px 24px rgba(212,175,55,.35)}
.wa{background:#1fa855;color:#fff}
.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(212,175,55,.3);color:var(--txt)}
.share{position:absolute;top:calc(14px);left:18px;font-size:13px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(212,175,55,.35);color:var(--gold2);cursor:pointer;font-family:inherit}
.ico{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;font-size:22px;text-decoration:none;color:var(--gold2)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<script>
// ===== بيانات الكارت (عدّل هنا فقط) =====
var CARD = {
  name: "م. ميشيل طلعت فكري",
  first: "ميشيل", last: "طلعت فكري",
  title: "مهندس صيانة ماكينات تصنيع أثاث",
  org: "Move To Future",
  phone1: "+201110171636",   // موبايل + واتساب
  phone2: "+201203390941",  // موبايل تاني
  email: "eng.misheel.talaat@gmail.com",
  mapUrl: "https://www.google.com/maps/search/?api=1&query=Cairo%2C%20Egypt",
  facebook: "https://www.facebook.com/move2future",
  linkedin: "https://www.linkedin.com/in/misheel-talaat-fekrey"
};

function $(id){return document.getElementById(id)}
function toast(t){var e=$("toast");e.textContent=t;e.className="toast on";setTimeout(function(){e.className="toast"},2200)}
function digits(s){return s.replace(/\D/g,"")}

$("waBtn").href = "https://wa.me/" + digits(CARD.phone1) + "?text=" + encodeURIComponent("مرحباً م. ميشيل، محتاج استفسر عن صيانة ماكينات.");
$("call1").href = "tel:" + CARD.phone1; $("call1").textContent = "📞 اتصال: " + CARD.phone1.replace("+20","0");
$("call2").href = "tel:" + CARD.phone2; $("call2").textContent = "📞 اتصال: " + CARD.phone2.replace("+20","0");
$("fb").href = CARD.facebook; $("li").href = CARD.linkedin;
if (CARD.email) { $("mailBtn").href = "mailto:" + CARD.email; $("mailBtn").textContent = "✉️ " + CARD.email; $("mailBtn").style.display = "flex"; }
if (CARD.mapUrl) { $("mapBtn").href = CARD.mapUrl; $("mapBtn").style.display = "flex"; }

function vcf(){
  var L = ["BEGIN:VCARD","VERSION:3.0",
    "N;CHARSET=UTF-8:" + CARD.last + ";" + CARD.first + ";;;",
    "FN;CHARSET=UTF-8:" + CARD.name,
    "ORG;CHARSET=UTF-8:" + CARD.org,
    "TITLE;CHARSET=UTF-8:" + CARD.title,
    "TEL;TYPE=CELL,VOICE:" + CARD.phone1,
    "TEL;TYPE=CELL:" + CARD.phone2];
  if (CARD.email) L.push("EMAIL;TYPE=INTERNET:" + CARD.email);
  L.push("URL:" + CARD.facebook, "URL:" + CARD.linkedin, "END:VCARD");
  return L.join("\r\n");
}
$("saveBtn").onclick = function(){
  try {
    var blob = new Blob([vcf()], {type:"text/vcard;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "Michel-Talaat.vcf";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href)}, 1500);
    toast("تم تجهيز جهة الاتصال ✅");
  } catch(e) { toast("تعذّر التحميل، جرّب متصفح آخر"); }
};
$("shareBtn").onclick = function(){
  var data = {title: CARD.name, text: CARD.name + " — " + CARD.title, url: location.href};
  if (navigator.share) { navigator.share(data).catch(function(){}); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(location.href).then(function(){toast("تم نسخ الرابط 🔗")}).catch(function(){toast("انسخ الرابط يدوياً")}); }
  else { toast("انسخ الرابط يدوياً"); }
};
</script>
